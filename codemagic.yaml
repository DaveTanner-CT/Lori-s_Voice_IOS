workflows:
  loris-voice-app-store:
    name: Lori's Voice - App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: app_store_connect

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: org.scriptingforschools.LorisVoice
      vars:
        XCODE_PROJECT: "LorisVoice.xcodeproj"
        XCODE_SCHEME: "LorisVoice"

    scripts:
      - name: Verify source configuration
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          plutil -lint App/Info.plist

          ICON_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconName" App/Info.plist 2>/dev/null || true)
          echo "Source CFBundleIconName = ${ICON_NAME:-<missing>}"

          test -f App/Assets.xcassets/AppIcon.appiconset/Contents.json
          test -f App/Assets.xcassets/AppIcon.appiconset/AppIcon-120.png
          test -f App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

          echo "Source configuration verification passed."

      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          xcodegen generate --spec project.yml

      - name: Apply signing profiles
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          xcode-project use-profiles

      - name: Build IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

      - name: Inspect packaged app
        script: |
          set -e

          IPA=$(find "$CM_BUILD_DIR/build/ios/ipa" -name "*.ipa" -print -quit)
          if [ -z "$IPA" ]; then
            echo "ERROR: IPA not found"
            exit 1
          fi

          rm -rf /tmp/loris_voice_ipa
          mkdir -p /tmp/loris_voice_ipa
          unzip -q "$IPA" -d /tmp/loris_voice_ipa

          APP=$(find /tmp/loris_voice_ipa/Payload -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP" ]; then
            echo "ERROR: App bundle not found in IPA"
            exit 1
          fi

          PLIST="$APP/Info.plist"
          echo "Inspecting packaged Info.plist at $PLIST"

          TOP_ICON=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$PLIST" 2>/dev/null || true)
          PRIMARY_ICON=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$PLIST" 2>/dev/null || true)
          IPAD_PRIMARY_ICON=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconName" "$PLIST" 2>/dev/null || true)

          echo "Top-level CFBundleIconName = ${TOP_ICON:-<missing>}"
          echo "CFBundleIcons primary icon name = ${PRIMARY_ICON:-<missing>}"
          echo "CFBundleIcons~ipad primary icon name = ${IPAD_PRIMARY_ICON:-<missing>}"

          ORIENTATIONS=$(/usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null | grep -c "UIInterfaceOrientation" || true)
          echo "iPad orientation entries = $ORIENTATIONS"

          if [ -f "$APP/Assets.car" ]; then
            echo "Assets.car is present."
            if command -v assetutil >/dev/null 2>&1; then
              assetutil --info "$APP/Assets.car" > /tmp/loris_assets.json 2>/dev/null || true
              echo "Asset catalog inspection generated at /tmp/loris_assets.json"
              grep -E 'AppIcon|120|152|180|1024' /tmp/loris_assets.json | head -40 || true
            fi
          else
            echo "WARNING: Assets.car is missing. Apple may reject the icon catalog."
          fi

          echo "Packaged app inspection complete. Publishing will continue so App Store Connect can perform authoritative validation."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /tmp/loris_assets.json

    publishing:
      app_store_connect:
        auth: integration
