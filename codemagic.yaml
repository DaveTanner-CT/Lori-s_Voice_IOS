workflows:
  loris-voice-app-store:
    name: Lori's Voice - App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: app_store_connect

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: org.scriptingforschools.LorisVoice
      vars:
        XCODE_PROJECT: "LorisVoice.xcodeproj"
        XCODE_SCHEME: "LorisVoice"

    scripts:
      - name: Verify source configuration
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          plutil -lint App/Info.plist
          test -f App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          test -f App/Assets.xcassets/AppIcon.appiconset/AppIcon-152.png
          test -f App/LegacyIcons/Icon-60@2x.png
          test -f App/LegacyIcons/Icon-76@2x.png
          echo "Source configuration verification passed."

      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          xcodegen generate --spec project.yml

      - name: Apply signing profiles
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          xcode-project use-profiles

      - name: Build IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

      - name: Verify packaged icons and plist
        script: |
          set -e
          IPA=$(find "$CM_BUILD_DIR/build/ios/ipa" -name "*.ipa" -print -quit)
          test -n "$IPA"

          rm -rf /tmp/loris_voice_ipa
          mkdir -p /tmp/loris_voice_ipa
          unzip -q "$IPA" -d /tmp/loris_voice_ipa

          APP=$(find /tmp/loris_voice_ipa/Payload -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          PLIST="$APP/Info.plist"

          echo "Packaged app: $APP"
          echo "CFBundleIconName: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$PLIST")"
          echo "iPad primary icon files:"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles' "$PLIST"

          echo "Packaged icon files:"
          find "$APP" -maxdepth 1 -type f -name 'Icon-*.png' -print | sort

          test -f "$APP/Icon-60@2x.png"
          test -f "$APP/Icon-60@3x.png"
          test -f "$APP/Icon-76.png"
          test -f "$APP/Icon-76@2x.png"
          test -f "$APP/Icon-83.5@2x.png"

          W120=$(sips -g pixelWidth "$APP/Icon-60@2x.png" | awk '/pixelWidth/{print $2}')
          H120=$(sips -g pixelHeight "$APP/Icon-60@2x.png" | awk '/pixelHeight/{print $2}')
          W152=$(sips -g pixelWidth "$APP/Icon-76@2x.png" | awk '/pixelWidth/{print $2}')
          H152=$(sips -g pixelHeight "$APP/Icon-76@2x.png" | awk '/pixelHeight/{print $2}')

          echo "Icon-60@2x.png = ${W120}x${H120}"
          echo "Icon-76@2x.png = ${W152}x${H152}"
          test "$W120" = "120"
          test "$H120" = "120"
          test "$W152" = "152"
          test "$H152" = "152"

          test -f "$APP/Assets.car"
          echo "Assets.car is present."

          codesign --verify --deep --strict "$APP"
          echo "Code signature verification passed."
          echo "Packaged icon verification passed."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
