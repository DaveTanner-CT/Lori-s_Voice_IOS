workflows:
  loris-voice-app-store:
    name: Lori's Voice - App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: org.scriptingforschools.LorisVoice
      vars:
        XCODE_PROJECT: "LorisVoice.xcodeproj"
        XCODE_SCHEME: "LorisVoice"

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate --spec project.yml

      - name: Apply signing profiles
        script: |
          cd "$CM_BUILD_DIR"
          xcode-project use-profiles

      - name: Build IPA
        script: |
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
