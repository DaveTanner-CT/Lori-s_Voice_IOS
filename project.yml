name: LorisVoice

options:
  bundleIdPrefix: org.scriptingforschools
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "5"
    DEVELOPMENT_TEAM: ""

targets:
  LorisVoice:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: App
        excludes:
          - Web
          - Assets.xcassets
          - Info.plist

    resources:
      - path: App/Web/index.html
      - path: App/Assets.xcassets

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.scriptingforschools.LorisVoice
        PRODUCT_NAME: "Lori's Voice"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

    scheme:
      gatherCoverageData: false
