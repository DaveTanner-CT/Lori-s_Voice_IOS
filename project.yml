name: LorisVoice

options:
  bundleIdPrefix: org.scriptingforschools
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "8"
    DEVELOPMENT_TEAM: ""

targets:
  LorisVoice:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: App
        excludes:
          - Web
          - Assets.xcassets
          - LegacyIcons
          - Info.plist

    resources:
      - path: App/Web/index.html
      - path: App/Assets.xcassets

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.scriptingforschools.LorisVoice
        PRODUCT_NAME: "Lori's Voice"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic

    postBuildScripts:
      - name: Copy required loose app icons
        basedOnDependencyAnalysis: false
        script: |
          set -e
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          SRC="${SRCROOT}/App/LegacyIcons"

          echo "Copying required app icons to: $DEST"
          mkdir -p "$DEST"

          cp "$SRC/Icon-60@2x.png" "$DEST/Icon-60@2x.png"
          cp "$SRC/Icon-60@3x.png" "$DEST/Icon-60@3x.png"
          cp "$SRC/Icon-76.png" "$DEST/Icon-76.png"
          cp "$SRC/Icon-76@2x.png" "$DEST/Icon-76@2x.png"
          cp "$SRC/Icon-83.5@2x.png" "$DEST/Icon-83.5@2x.png"
          cp "$SRC/Icon-Small-40.png" "$DEST/Icon-Small-40.png"
          cp "$SRC/Icon-Small-40@2x.png" "$DEST/Icon-Small-40@2x.png"
          cp "$SRC/Icon-Small.png" "$DEST/Icon-Small.png"
          cp "$SRC/Icon-Small@2x.png" "$DEST/Icon-Small@2x.png"

          echo "Loose icon copy complete."
          ls -l "$DEST"/Icon-*.png

    scheme:
      gatherCoverageData: false
